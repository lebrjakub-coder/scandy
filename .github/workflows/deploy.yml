# Nasazení na Wedos: po každém pushi do main GitHub sestaví web a nahraje dist/ přes FTP.
# FTP údaje jsou v GitHub Secrets (Settings → Secrets and variables → Actions), nikdy v repozitáři.
name: Nasazení na Wedos

on:
  push:
    branches: [main]
  workflow_dispatch:

# Když přijdou dva pushe rychle za sebou, starší nasazení se zruší a doběhne jen to poslední.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Nahrát dist/ na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: www/
          # Nahrávají se jen změněné soubory; smazané soubory se mažou i na serveru.
          dangerous-clean-slate: false
